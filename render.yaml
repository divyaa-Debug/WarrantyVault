services:
  - type: web
    name: warrantyvault
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: warrantyvault
      - key: DB_PORT
        value: "3306"
